<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy MES League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060F18; --panel:#0C1A26; --panel2:#102534; --line:#1B3143; --line2:#254458;
  --chalk:#E8F1F5; --muted:#7D96A8; --dim:#4F6A7D;
  --amber:#FFB23F; --amber-d:#8A5E14; --teal:#34D8B2; --red:#FF6363; --violet:#9D8CFF;
  --r:10px;
  --fd:"Anton",Impact,"Arial Narrow",sans-serif;
  --fb:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--fb);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(1100px 500px at 78% -10%,rgba(255,178,63,.09),transparent 60%),
             radial-gradient(800px 420px at 8% 108%,rgba(52,216,178,.07),transparent 62%)}
a{color:var(--amber);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:20px 14px 24px;position:sticky;top:0;height:100vh;
  overflow-y:auto;background:rgba(6,15,24,.7);display:flex;flex-direction:column}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 18px}
.brand b{font-family:var(--fd);font-size:34px;letter-spacing:.02em;line-height:1}
.brand b i{font-style:normal;color:var(--amber)}
.brand span{font-size:10.5px;color:var(--dim);letter-spacing:.08em;line-height:1.25;max-width:88px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);
  font-weight:500;font-size:14px;text-align:left;width:100%}
.nav button:hover{background:var(--panel);color:var(--chalk)}
.nav button[aria-current="true"]{background:var(--panel2);color:var(--chalk);box-shadow:inset 2px 0 0 var(--amber)}
.nav .ico{width:17px;text-align:center;font-size:14px}
.nav .sep{margin:16px 10px 6px;font-size:10.5px;color:var(--dim);letter-spacing:.09em;border-top:1px solid var(--line);padding-top:12px}
.who{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.who b{display:block;color:var(--chalk);font-size:14px;font-weight:600}
.who .club{color:var(--amber);font-size:12px}
.main{padding:24px 28px 80px;max-width:1120px;overflow-x:hidden}

/* ---------- primitives ---------- */
.ph{margin-bottom:20px}
.ph h1{font-family:var(--fd);font-size:30px;letter-spacing:.01em;line-height:1.05;font-weight:400}
.ph p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:64ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line2);font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--amber);color:#150E00;border-color:var(--amber);font-weight:600}
.btn.pri:hover{background:#ffc063}
.btn.gho{background:none;border-color:var(--line)}
.btn.dan{color:var(--red);border-color:#4a2230}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.tabs button{padding:6px 16px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--chalk);box-shadow:0 0 0 1px var(--line2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  font-weight:600;border:1px solid var(--line2);color:var(--muted)}
.pill.on{color:var(--teal);border-color:#1d5a4c;background:rgba(52,216,178,.08)}
.pill.off{color:var(--dim)}
.pill.warn{color:var(--amber);border-color:var(--amber-d);background:rgba(255,178,63,.08)}
.pill.bad{color:var(--red);border-color:#5a2020;background:rgba(255,99,99,.08)}
.pill.live{color:var(--red);border-color:#5a2020;background:rgba(255,99,99,.12)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);animation:blip 1.4s infinite}
@keyframes blip{50%{opacity:.25}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px;border-bottom:1px solid rgba(27,49,67,.55);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(16,37,52,.5)}
tr.me{background:rgba(255,178,63,.07)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.r{text-align:right}
.pos{color:var(--teal)}.neg{color:var(--red)}.zero{color:var(--dim)}
.rk{font-family:var(--fd);font-size:17px;color:var(--muted);width:34px}
.club{font-size:11.5px;color:var(--amber)}

input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  background:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;width:100%;
  outline:none;font-size:13.5px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,178,63,.14)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- dashboard ---------- */
.hero{background:linear-gradient(152deg,#17304a,#0C1A26 60%);border:1px solid var(--line2);
  border-radius:14px;padding:26px 28px;margin-bottom:16px}
.hero .lab{font-size:12px;color:var(--muted);margin-bottom:2px}
.hero .big{font-family:var(--fd);font-size:76px;line-height:.92;color:var(--amber);letter-spacing:.01em}
.hero .sub{font-size:13.5px;color:var(--muted);margin-top:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-family:var(--fd);font-size:32px;line-height:1.1;margin-top:2px}
.chiprow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(27,49,67,.55)}
.chiprow:last-child{border-bottom:none}
.chiprow .n{font-weight:500;font-size:13.5px}

/* ---------- matchday ---------- */
.md{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.md.now{background:linear-gradient(150deg,#14283a,#0C1A26 62%);border-color:var(--line2)}
.md .day{font-family:var(--fd);font-size:26px;line-height:1.1}
.md.now .day{font-size:34px}
.md .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.md .score{font-family:var(--fd);font-size:36px;letter-spacing:.02em;white-space:nowrap}
.md.past{padding:13px 17px}
.md.past .day{font-size:19px}
.md.past .score{font-size:24px}

/* ---------- pitch ---------- */
.pitch{background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 74px,transparent 74px 148px),
  linear-gradient(170deg,#0d2a25,#0A1F1C);border:1px solid #17403a;border-radius:12px;padding:16px 12px;position:relative;overflow:hidden}
.pitch::after{content:"";position:absolute;left:50%;top:-58px;width:160px;height:116px;
  border:1px solid rgba(232,241,245,.09);border-radius:50%;transform:translateX(-50%)}
.prow{display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pc{width:88px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 4px;
  text-align:center;position:relative;cursor:pointer}
.pc:hover{border-color:var(--amber)}
.pc .nm{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pt{font-family:var(--fd);font-size:20px;line-height:1.15}
.pc .sub{font-size:10px;color:var(--dim)}
.pc .cap{position:absolute;top:-6px;left:-6px;width:19px;height:19px;border-radius:50%;background:var(--amber);
  color:#150E00;font-size:10px;font-weight:700;display:grid;place-items:center}
.pc .cap.v{background:var(--panel2);color:var(--chalk);border:1px solid var(--line2)}
.pc.out{opacity:.45;border-style:dashed}
.pc.empty{background:rgba(12,26,38,.45);border-style:dashed;border-color:var(--line);cursor:default}
.pc.gam{box-shadow:0 0 0 1px var(--violet)}
.bench{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line2)}
.bench .lab{font-size:11.5px;color:var(--muted);margin-bottom:8px}

/* ---------- social ---------- */
.post{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.post .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.crest{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-family:var(--fd);
  font-size:15px;color:#150E00;background:var(--amber);flex:none}
.post .tn{font-weight:700;font-size:14.5px;line-height:1.2}
.post .mg{font-size:11.5px;color:var(--muted)}
.post .when{margin-left:auto;font-size:11.5px;color:var(--dim)}
.post .kind{font-size:11px;letter-spacing:.14em;color:var(--amber);font-weight:700;margin-bottom:6px}
.post .body{font-size:14px;line-height:1.6;white-space:pre-wrap}
.post .foot{margin-top:10px;font-size:11.5px;color:var(--dim)}

/* ---------- misc ---------- */
.chip{border:1px solid var(--line2);border-radius:var(--r);padding:14px;background:var(--panel);
  display:flex;flex-direction:column;gap:8px}
.chip h4{font-size:14px}
.chip p{margin:0;font-size:12px;color:var(--muted);line-height:1.45;flex:1}
.chip.used{opacity:.5}
.chip.live{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,178,63,.25)}
.bd{font-size:13px}
.bd .l{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(27,49,67,.5)}
.bd .l:last-child{border:none}
.bd .t{display:flex;justify-content:space-between;padding-top:9px;margin-top:5px;border-top:1px solid var(--line2);font-weight:700}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--chalk);font-size:15px;margin-bottom:5px;font-weight:600}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.modal{position:fixed;inset:0;background:rgba(3,8,13,.78);display:grid;place-items:center;padding:18px;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:13px;max-width:560px;width:100%;
  max-height:86vh;overflow-y:auto;padding:22px}
.modal h2{font-family:var(--fd);font-size:22px;font-weight:400;margin-bottom:4px}
.modal .x{float:right;color:var(--muted);font-size:20px;line-height:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line2);border-radius:9px;padding:11px 18px;font-size:13.5px;z-index:99;
  box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.err{border-color:#5a2020;color:var(--red)}
.banner{background:rgba(255,178,63,.08);border:1px solid var(--amber-d);border-radius:var(--r);
  padding:11px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.gate{max-width:400px;margin:8vh auto;padding:0 18px}
.gate .brand{justify-content:center;padding-bottom:20px}
.mini{font-size:11.5px;color:var(--dim)}
.bar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--amber);z-index:200;
  animation:load 1.1s ease-in-out infinite;transform-origin:left}
@keyframes load{0%{transform:scaleX(0)}50%{transform:scaleX(.7)}100%{transform:scaleX(1);opacity:0}}
.sync{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:8px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}
.sync.bad::before{background:var(--red)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;padding:6px 2px;border-right:none;
    border-top:1px solid var(--line);background:rgba(6,15,24,.97);backdrop-filter:blur(8px);z-index:40}
  .side .brand,.side .who,.side .sep{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:0}
  .nav button{flex-direction:column;gap:2px;font-size:9px;padding:7px 6px;min-width:56px;align-items:center;text-align:center}
  .nav button[aria-current="true"]{box-shadow:inset 0 2px 0 var(--amber)}
  .nav .ico{font-size:16px}
  .main{padding:16px 14px 96px}
  .g4,.g3,.g2{grid-template-columns:repeat(2,1fr)}
  .ph h1{font-size:24px}
  .hero{padding:20px}
  .hero .big{font-size:58px}
  .pc{width:74px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ============================================================================
   1. SCORING ENGINE (preview copy)
   The authoritative version of this runs on the server. This copy exists only
   so a moderator can see the numbers a draft match would produce before it is
   published. Nothing shown to managers is calculated here.
   ---------------------------------------------------------------------------
   FML scoring engine — the only place fantasy points are ever calculated.
   Pure functions: same inputs always give the same numbers, so a published
   match can be recalculated at any time and land on the same result.
   =========================================================================== */

const RULES = {
  goal: 5, assist: 3, save: 1, cleanSheet: 3, motm: 5,
  yellow: -1, red: -4, ownGoal: -3, appearance: 0,
  defCon: [{ min: 15, pts: 7 }, { min: 10, pts: 5 }, { min: 5, pts: 3 }, { min: 0, pts: 0 }]
};
const BLANK = {
  played: false, goals: 0, assists: 0, saves: 0, tackles: 0,
  interceptions: 0, yellow: 0, red: 0, own_goals: 0, clean_sheet: false
};
const SQUAD_SIZE = 11, XI_SIZE = 9, BENCH_SIZE = 2;

function defConPoints(dc) {
  for (const b of RULES.defCon) if (dc >= b.min) return b.pts;
  return 0;
}

/* One player, one match. Returns the total and the line-by-line trail. */
function scorePlayer(raw, isMotm) {
  const s = Object.assign({}, BLANK, raw || {});
  if (!s.played) return { total: 0, lines: [{ label: 'Did not play', pts: 0 }], played: false, dc: 0 };
  const lines = [];
  const add = (label, pts) => { if (pts !== 0) lines.push({ label, pts }); };
  add(s.goals === 1 ? 'Goal' : `Goals ×${s.goals}`, s.goals * RULES.goal);
  add(s.assists === 1 ? 'Assist' : `Assists ×${s.assists}`, s.assists * RULES.assist);
  add(s.saves === 1 ? 'Save' : `Saves ×${s.saves}`, s.saves * RULES.save);
  const dc = (s.tackles || 0) + (s.interceptions || 0);
  const dcp = defConPoints(dc);
  if (dcp) lines.push({ label: `Defensive contributions: ${dc}`, pts: dcp });
  if (s.clean_sheet) add('Clean sheet', RULES.cleanSheet);
  if (isMotm) add('Man of the match', RULES.motm);
  add(s.yellow === 1 ? 'Yellow card' : `Yellow cards ×${s.yellow}`, s.yellow * RULES.yellow);
  add(s.red === 1 ? 'Red card' : `Red cards ×${s.red}`, s.red * RULES.red);
  add(s.own_goals === 1 ? 'Own goal' : `Own goals ×${s.own_goals}`, s.own_goals * RULES.ownGoal);
  const total = lines.reduce((a, l) => a + l.pts, 0);
  if (!lines.length) lines.push({ label: 'Played, no scoring actions', pts: 0 });
  return { total, lines, played: true, dc };
}

/* Every player's base score for one match. Shared by every manager. */
function scoreMatch(statRows, motmId) {
  const out = {};
  for (const row of statRows) out[row.player_id] = scorePlayer(row, motmId === row.player_id);
  return out;
}

/* ---------------------------------------------------------------------------
   One manager, one match day.
   lineup = {xi:[9], bench:[2], captain, vice, chips:{}, subs:{}}
   base   = {playerId: {total, played}}
--------------------------------------------------------------------------- */
function scoreManagerDay(lineup, base) {
  const chips = lineup.chips || {};
  const pts = id => (base[id] ? base[id].total : 0);
  const played = id => !!(base[id] && base[id].played);
  const xi = (lineup.xi || []).slice();
  const bench = (lineup.bench || []).slice();
  const notes = [], swaps = [];

  /* Bench cover — only for starters the moderators marked absent. */
  const used = new Set();
  const chosen = lineup.subs || {};
  const effective = xi.map(id => {
    if (played(id)) return id;
    let inId = chosen[id];
    if (!inId || used.has(inId) || !bench.includes(inId) || !played(inId)) {
      inId = bench.filter(b => !used.has(b) && played(b)).sort((a, b) => pts(b) - pts(a))[0];
      if (inId && chosen[id]) notes.push('A chosen replacement was unavailable, so the next best bench player came on.');
    }
    if (inId) { used.add(inId); swaps.push({ out: id, in: inId, auto: !chosen[id] }); return inId; }
    notes.push('An absent starter had no available bench cover and scored 0.');
    return id;
  });

  /* Captaincy, decided only after we know who actually played. */
  let capId = null, capWhy = '';
  if (lineup.captain && played(lineup.captain) && effective.includes(lineup.captain)) {
    capId = lineup.captain; capWhy = 'captain';
  } else if (lineup.vice && played(lineup.vice) && effective.includes(lineup.vice)) {
    capId = lineup.vice; capWhy = 'vice';
    notes.push('Captain did not play, so the armband passed to the vice-captain.');
  } else if (lineup.captain || lineup.vice) {
    notes.push('Neither captain nor vice-captain played, so no multiplier was applied.');
  }

  const mult = chips.allOrNothing ? 4 : chips.tripleCaptain ? 3 : 2;
  const lines = [];
  let total = 0;
  for (const id of effective) {
    const p = pts(id), m = id === capId ? mult : 1;
    lines.push({ id, base: p, mult: m, pts: p * m, role: id === capId ? capWhy : '', bench: false });
    total += p * m;
  }
  if (chips.benchBoost) {
    for (const id of bench) {
      if (effective.includes(id)) continue;
      lines.push({ id, base: pts(id), mult: 1, pts: pts(id), role: '', bench: true });
      total += pts(id);
    }
    notes.push('Bench Boost: both bench players scored.');
  }

  /* The Gambler — judged on the player's own score, before any multiplier. */
  let gambler = null;
  if (chips.gambler) {
    const g = chips.gambler;
    if (lines.some(l => l.id === g)) {
      const raw = pts(g);
      const delta = raw >= 10 ? 10 : raw >= 5 ? 0 : -10;
      gambler = { id: g, raw, delta };
      total += delta;
    } else notes.push('The Gambler pick was not in the scoring team, so it had no effect.');
  }

  /* All or Nothing — halves a finished positive day after a blank captain. */
  let halved = false;
  if (chips.allOrNothing) {
    const capBase = capId ? pts(capId) : 0;
    if (capBase <= 0) {
      if (total > 0) { total = Math.round(total / 2); halved = true; notes.push('All or Nothing: the captain blanked, so the day score was halved.'); }
      else notes.push('All or Nothing: the captain blanked, but the day was not positive so nothing was halved.');
    }
  }
  return { total, lines, swaps, notes, captainId: capId, captainSource: capWhy, multiplier: capId ? mult : 1, gambler, halved };
}

/* ============================================================================
   2. DATA LAYER — the league lives on the server, not in this browser.
   The only thing kept locally is the login session. Every score rendered here
   was calculated by the backend and read back out of the database.
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "zero";
const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const dowOf = d => new Date(d + "T12:00:00").getUTCDay();
const dayName = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });
const matchdayName = d => DOW[dowOf(d)] + " Matchday";
const hhmm = t => {
  const [h, m] = String(t || "12:00").split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  return ((h % 12) || 12) + ":" + String(m).padStart(2, "0") + " " + ap;
};
function ago(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 604800) return Math.floor(s / 86400) + "d ago";
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function toast(msg, err) {
  const t = $("#toast");
  t.innerHTML = '<div class="toast' + (err ? " err" : "") + '">' + esc(msg) + "</div>";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.innerHTML = ""; }, err ? 5200 : 2600);
}

const Store = {
  sb: null, session: null, raw: null, core: null, matches: {}, entries: {},
  official: {}, dayScores: {}, posts: [],
  ready: false, status: "connecting", error: null, busy: false, lastSync: null,

  async connect() {
    let cfg;
    try {
      const r = await fetch("/api/config");
      cfg = await r.json();
      if (cfg.error) throw new Error(cfg.error);
    } catch (e) {
      this.status = "noconfig"; this.error = e.message; this.ready = true; return;
    }
    if (!window.supabase) { this.status = "noconfig"; this.error = "The authentication library did not load. Check your connection and refresh."; this.ready = true; return; }
    this.sb = window.supabase.createClient(cfg.url, cfg.anonKey);
    const { data } = await this.sb.auth.getSession();
    this.session = data.session || null;
    this.sb.auth.onAuthStateChange((_e, s) => { this.session = s; });
    if (this.session) await this.refresh();
    else { this.status = "signedout"; this.ready = true; }
  },

  async api(path, payload) {
    if (!this.session) throw new Error("You are signed out.");
    const r = await fetch(path, {
      method: payload ? "POST" : "GET",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + this.session.access_token },
      body: payload ? JSON.stringify(payload) : undefined
    });
    let out;
    try { out = await r.json(); } catch (e) { throw new Error("The server sent back something unreadable."); }
    if (!r.ok) throw new Error(out.error || "Request failed (" + r.status + ")");
    return out;
  },

  /* every write returns the whole refreshed league, so the screen can never
     drift away from what the database actually holds */
  async act(payload, path) {
    this.busy = true; render();
    try {
      this.absorb(await this.api(path || "/api/team", payload));
      return true;
    } catch (e) {
      toast(e.message, true); return false;
    } finally { this.busy = false; render(); }
  },

  async refresh(quiet) {
    try {
      this.absorb(await this.api("/api/league"));
      this.status = "ready"; this.error = null;
    } catch (e) {
      this.status = "error"; this.error = e.message;
      if (!quiet) toast(e.message, true);
    }
    this.ready = true;
  },

  absorb(L) {
    this.raw = L;
    this.lastSync = new Date();
    const core = {
      config: {
        league: L.config.league, currentGw: L.config.current_gw, currentTerm: L.config.current_term,
        deadline: L.config.deadline, schoolDays: L.config.school_days || [0, 1, 2, 3, 4],
        timezone: L.config.timezone
      },
      players: {}, managers: {}, gameweeks: {}, chipUsage: {}
    };
    for (const p of L.players) core.players[p.id] = { id: p.id, name: p.name, active: p.active };
    for (const m of L.managers) core.managers[m.id] = { id: m.id, name: m.name, team: m.team_name, isAdmin: m.is_admin, playerId: m.player_id };
    for (const g of L.gameweeks) core.gameweeks[g.number] = { number: g.number, start: g.start_date, end: g.end_date, status: g.status, locked: g.locked };
    for (const c of L.chipUsage) {
      core.chipUsage[c.manager_id] = core.chipUsage[c.manager_id] || {};
      core.chipUsage[c.manager_id][c.term] = core.chipUsage[c.manager_id][c.term] || {};
      core.chipUsage[c.manager_id][c.term][c.chip] = c.ref || true;
    }
    this.core = core;

    this.matches = {};
    for (const m of L.matches) {
      this.matches[m.id] = {
        id: m.id, date: m.match_date, kickoff: m.kickoff, gw: m.gw, state: m.state,
        status: m.status, home: m.home_score, away: m.away_score, motm: m.motm,
        stats: {}, deadline: L.deadlines[m.id]
      };
    }
    for (const s of L.stats) {
      const m = this.matches[s.match_id]; if (!m) continue;
      m.stats[s.player_id] = {
        played: s.played, goals: s.goals, assists: s.assists, saves: s.saves,
        tackles: s.tackles, interceptions: s.interceptions, yellow: s.yellow,
        red: s.red, own_goals: s.own_goals, clean_sheet: s.clean_sheet
      };
    }
    this.official = {};
    for (const r of L.playerScores) {
      (this.official[r.match_id] = this.official[r.match_id] || {})[r.player_id] =
        { total: r.points, lines: r.breakdown, played: r.played };
    }
    this.dayScores = {};
    for (const r of L.dayScores) {
      (this.dayScores[r.match_id] = this.dayScores[r.match_id] || {})[r.manager_id] =
        Object.assign({ total: r.points }, r.detail || {});
    }
    this.entries = {};
    for (const e of L.entries) {
      this.entries[e.manager_id + "__gw" + e.gw] = {
        id: e.manager_id + "__gw" + e.gw, managerId: e.manager_id, gw: e.gw,
        squad: e.squad || [], xi: e.xi || [], captain: e.captain, vice: e.vice,
        changesUsed: e.changes_used || 0, wildcard: !!e.wildcard,
        pendingChips: e.pending_chips || {}, days: {}
      };
    }
    for (const l of L.lineups) {
      const m = this.matches[l.match_id]; if (!m) continue;
      const e = this.entries[l.manager_id + "__gw" + m.gw]; if (!e) continue;
      e.days[m.date] = { xi: l.xi, bench: l.bench, captain: l.captain, vice: l.vice, chips: l.chips || {}, subs: l.subs || {}, matchId: l.match_id };
    }
    this.posts = L.posts || [];
    S.me = L.me;
  },

  async signIn(email, password) {
    const { error } = await this.sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(error.message);
    this.session = (await this.sb.auth.getSession()).data.session;
    try { await this.api("/api/bootstrap", { name: (email || "").split("@")[0] }); } catch (e) { }
    await this.refresh();
  },
  async signUp(email, password, name, teamName) {
    const { error } = await this.sb.auth.signUp({ email, password });
    if (error) throw new Error(error.message);
    let s = (await this.sb.auth.getSession()).data.session;
    if (!s) {
      const r = await this.sb.auth.signInWithPassword({ email, password });
      if (r.error) throw new Error("Account created. Check your email to confirm it, then sign in.");
      s = (await this.sb.auth.getSession()).data.session;
    }
    this.session = s;
    await this.api("/api/bootstrap", { name, teamName });
    await this.refresh();
  },
  async signOut() {
    await this.sb.auth.signOut();
    this.session = null; this.core = null; this.raw = null; this.status = "signedout";
    render();
  }
};

/* ---------------- read-only helpers over server data ---------------- */
const C = () => Store.core;
const players = () => Object.values(C().players || {});
const activePlayers = () => players().filter(p => p.active !== false);
const managers = () => Object.values(C().managers || {});
const pName = id => (C().players[id] || {}).name || "Unknown";
const mName = id => (C().managers[id] || {}).name || "Unknown";
const tName = id => (C().managers[id] || {}).team || "Unnamed FC";
const ME = () => (C() && C().managers ? C().managers[S.me] : null);
const isAdmin = () => !!(ME() && ME().isAdmin);
const curGw = () => C().config.currentGw;
const gwOf = n => (C().gameweeks || {})[n] || { number: n, status: "live" };
const gwNumbers = () => Object.keys(C().gameweeks || {}).map(Number).sort((a, b) => a - b);
const today = () => (Store.raw && Store.raw.today) || new Date().toISOString().slice(0, 10);

function getEntry(mid, gw) {
  return Store.entries[mid + "__gw" + gw] ||
    { id: mid + "__gw" + gw, managerId: mid, gw, squad: [], xi: [], captain: null, vice: null, changesUsed: 0, wildcard: false, pendingChips: {}, days: {} };
}
const matchesIn = gw => Object.values(Store.matches).filter(m => m.gw === gw).sort((a, b) => a.date < b.date ? -1 : 1);
const publishedIn = gw => matchesIn(gw).filter(m => m.status === "published");
const allPublished = () => Object.values(Store.matches).filter(m => m.status === "published").sort((a, b) => a.date < b.date ? -1 : 1);

/* published matches use the official scores from the database; a draft is
   previewed with the local engine so moderators can check before publishing */
function matchScores(m) {
  if (m.status === "published" && Store.official[m.id]) return Store.official[m.id];
  const out = {};
  for (const pid of Object.keys(m.stats || {})) out[pid] = scorePlayer(m.stats[pid], m.motm === pid);
  return out;
}
const managerDay = (mid, m) => (Store.dayScores[m.id] || {})[mid] || null;
function managerGwPoints(mid, gw) {
  let t = 0; for (const m of publishedIn(gw)) { const r = managerDay(mid, m); if (r) t += r.total; } return t;
}
function managerSeasonPoints(mid) {
  let t = 0; for (const g of gwNumbers()) t += managerGwPoints(mid, g); return t;
}
function rankRows(rows, key) {
  rows.sort((a, b) => b[key] - a[key] || a.name.localeCompare(b.name));
  let r = 0, last = null, seen = 0;
  rows.forEach(x => { seen++; if (x[key] !== last) { r = seen; last = x[key]; } x.rank = r; });
  return rows;
}
const gwTable = gw => rankRows(managers().map(m => ({
  id: m.id, name: m.name, team: m.team, pts: managerGwPoints(m.id, gw)
})), "pts");
const seasonTable = () => rankRows(managers().map(m => ({
  id: m.id, name: m.name, team: m.team, pts: managerSeasonPoints(m.id)
})), "pts");

/* player statistics, aggregated over a chosen span */
function statTable(field, scope) {
  const ms = scope === "gw" ? publishedIn(curGw()) : allPublished();
  const agg = {};
  for (const m of ms) {
    for (const pid of Object.keys(m.stats || {})) {
      const s = m.stats[pid]; if (!s.played) continue;
      agg[pid] = agg[pid] || 0;
      agg[pid] += field === "clean_sheet" ? (s.clean_sheet ? 1 : 0) : (s[field] || 0);
    }
  }
  return rankRows(Object.keys(agg).filter(id => agg[id] > 0)
    .map(id => ({ id, name: pName(id), pts: agg[id] })), "pts");
}
const CHIPS = {
  tripleCaptain: { name: "Triple Captain", blurb: "Your captain scores 3× instead of 2× for one matchday.", scope: "day" },
  wildcard: { name: "Wildcard", blurb: "Unlimited changes to your starting nine for the rest of this gameweek.", scope: "week" },
  allOrNothing: { name: "All or Nothing", blurb: "Captain scores 4×. If the captain blanks, your whole day score is halved.", scope: "day" },
  gambler: { name: "The Gambler", blurb: "Back one player. 10+ earns +10, 5–9 is neutral, under 5 costs you 10.", scope: "day" },
  benchBoost: { name: "Bench Boost", blurb: "Both bench players score alongside your starting nine.", scope: "day" }
};
const chipsUsedBy = mid => ((C().chipUsage || {})[mid] || {})[C().config.currentTerm] || {};

function squadLocked(gw) {
  if (gwOf(gw).locked) return true;
  if (publishedIn(gw).length) return true;
  return Object.keys(getEntry(S.me, gw).days || {}).length > 0;
}
const deadlinePassed = m => m.deadline ? new Date(m.deadline).getTime() <= Date.now() : false;
function currentMatchday(gw) {
  const ms = matchesIn(gw);
  return ms.find(m => m.state === "live") || ms.find(m => m.state === "upcoming" && m.date >= today())
      || ms.find(m => m.state === "upcoming") || ms[ms.length - 1] || null;
}

const S = { view: "dash", me: null, lb: "gw", stats: "gw", gwView: null, squadOpen: false, authMode: "in" };

const NAV = [
  { id: "dash", label: "Dashboard", ico: "◎" },
  { id: "gameweek", label: "Gameweek", ico: "▤" },
  { id: "league", label: "Leaderboard", ico: "▲" },
  { id: "stats", label: "Player Stats", ico: "✦" },
  { id: "scoring", label: "Scoring", ico: "§" },
  { id: "social", label: "Social Media", ico: "◈" }
];

function go(v) { S.view = v; S.squadOpen = false; window.scrollTo(0, 0); render(); }
const initials = s => String(s || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

function render() {
  const app = $("#app");
  const bar = Store.busy ? '<div class="bar"></div>' : "";
  if (!Store.ready) { app.innerHTML = '<div class="bar"></div><div class="gate"><div class="empty">Connecting to the league…</div></div>'; return; }
  if (Store.status === "noconfig") return app.innerHTML = configErrorView();
  if (!Store.session || Store.status === "signedout") return app.innerHTML = bar + gateView();
  if (Store.status === "error" && !Store.core) return app.innerHTML = bar + errorView();
  if (!Store.core) return app.innerHTML = '<div class="bar"></div>';

  const v = S.view;
  const body =
    v === "dash" ? dashView() : v === "gameweek" ? gameweekView() : v === "league" ? leagueView() :
    v === "stats" ? statsView() : v === "scoring" ? scoringView() : v === "social" ? socialView() :
    v === "admin" ? adminView() : dashView();

  app.innerHTML = bar +
    '<div class="shell"><aside class="side">' +
      '<div class="brand"><b>F<i>M</i>L</b><span>Fantasy MES League</span></div>' +
      '<nav class="nav">' +
        NAV.map(n => '<button data-go="' + n.id + '" aria-current="' + (v === n.id) + '"><span class="ico">' + n.ico + '</span>' + n.label + '</button>').join("") +
        (isAdmin() ? '<div class="sep">Moderator</div><button data-go="admin" aria-current="' + (v === "admin") + '"><span class="ico">⚙</span>Admin</button>' : "") +
      '</nav>' +
      '<div class="who"><b>' + esc(mName(S.me)) + '</b><span class="club">' + esc(tName(S.me)) + '</span>' +
        '<div class="sync' + (Store.status === "error" ? " bad" : "") + '">' +
          (Store.status === "error" ? "Connection problem" : "Live · synced " + (Store.lastSync ? ago(Store.lastSync.toISOString()) : "")) + '</div>' +
        '<div class="row" style="margin-top:8px">' +
        '<button data-act="rename" style="color:var(--muted);font-size:12px">Rename club</button>' +
        '<button data-act="signout" style="color:var(--amber);font-size:12px">Sign out</button></div></div>' +
    '</aside><main class="main">' + body + '</main></div>';
}

/* ---------------------------------------------------------- Dashboard --- */
function dashView() {
  const gw = curGw(), e = getEntry(S.me, gw);
  const played = publishedIn(gw).length;
  const used = chipsUsedBy(S.me);
  const season = managerSeasonPoints(S.me);
  const rank = seasonTable().find(r => r.id === S.me);
  const todo = [];
  if ((e.squad || []).length < SQUAD_SIZE) todo.push("Pick your " + SQUAD_SIZE + "-player squad");
  else if ((e.xi || []).length !== XI_SIZE) todo.push("Set your starting nine");
  else if (!e.captain) todo.push("Choose a captain");

  return '<div class="ph"><h1>' + esc(tName(S.me)) + '</h1><p>' + esc(mName(S.me)) + "'s season so far</p></div>" +
    (todo.length ? '<div class="banner">◆ <button data-go="gameweek" style="color:var(--amber);font-weight:600">' + esc(todo[0]) + '</button></div>' : "") +
    '<div class="hero"><div class="lab">Points so far</div>' +
      '<div class="big num">' + season + '</div>' +
      '<div class="sub">' + (rank ? "Ranked " + rank.rank + " of " + managers().length + " this season" : "") +

        return '<div class="chiprow"><span class="n">' + esc(CHIPS[k].name) + '</span>' +
          (live ? '<span class="pill warn">Armed</span>' : isUsed ? '<span class="pill off">Used</span>' : '<span class="pill on">Available</span>') +

/* ---------------------------------------------------------- Gameweek ---- */
function gameweekView() {
  const gw = S.gwView || curGw();
  const isCurrent = gw === curGw();
  const ms = matchesIn(gw);
  const now = currentMatchday(gw);
  const past = ms.filter(m => m !== now && (m.state === "final" || m.status === "published"))
                 .sort((a, b) => a.date < b.date ? 1 : -1);

  return '<div class="ph"><h1>Gameweek ' + gw + '</h1>' +
    '<p>' + (gwOf(gw).start ? dayName(gwOf(gw).start) + " – " + dayName(gwOf(gw).end) : "") +
    (isCurrent ? " · current" : " · complete") + '</p></div>' +
    '<div class="row" style="margin-bottom:18px">' +
      gwNumbers().map(n => '<button class="btn sm ' + (n === gw ? "pri" : "gho") + '" data-gw="' + n + '">GW ' + n + (n === curGw() ? " ·" : "") + '</button>').join("") +
    '</div>' +
    (now ? matchdayCard(now, true) : '<div class="card"><div class="empty"><b>No matchday scheduled</b>Fixtures are created automatically for each school day.</div></div>') +
    (past.length ? '<h3 style="font-size:12px;color:var(--muted);margin:22px 0 10px">Earlier this gameweek</h3>' +
      past.map(m => matchdayCard(m, false)).join("") : "") +
    (isCurrent ? teamPanel(gw) : "");
}
function matchdayCard(m, big) {
  const state = m.state === "live" ? '<span class="pill live">Live</span>'
    : m.state === "postponed" ? '<span class="pill bad">Postponed</span>'
    : m.state === "final" ? '<span class="pill">Final</span>'
    : '<span class="pill warn">Upcoming</span>';
  const mine = m.status === "published" ? managerDay(S.me, m) : null;
  const score = (m.home != null && m.away != null) ? m.home + "–" + m.away : "";
  return '<div class="md ' + (big ? "now" : "past") + '" style="margin-bottom:10px"><div class="spread">' +
    '<div><div class="day">' + matchdayName(m.date) + '</div>' +
    '<div class="meta">' + (m.state === "upcoming" ? hhmm(m.kickoff) + " · " + dayName(m.date) : dayName(m.date)) +
      (mine ? " · you scored " + mine.total : "") + '</div></div>' +
    '<div style="text-align:right">' + (score ? '<div class="score">' + score + '</div>' : "") +
    '<div style="margin-top:4px">' + state + '</div></div></div>' +
    (m.status === "published" ? '<div class="row" style="margin-top:12px">' +
      '<button class="btn sm gho" data-match="' + m.id + '">Match detail</button>' +

    '</div>';
}

/* team management lives here: it is all about the current gameweek */
function teamPanel(gw) {
  const e = getEntry(S.me, gw);
  if (S.squadOpen || (e.squad || []).length < SQUAD_SIZE) return squadPicker(e, gw);
  const locked = squadLocked(gw);
  const xi = e.xi || [], bench = e.squad.filter(id => !xi.includes(id));
  const changes = e.wildcard ? "unlimited" : Math.max(0, 2 - (e.changesUsed || 0)) + " left";
  const lastM = publishedIn(gw).slice(-1)[0];
  const scores = lastM ? matchScores(lastM) : {};
  const dayR = lastM ? managerDay(S.me, lastM) : null;
  const openSubs = publishedIn(gw).filter(m => {
    const d = (e.days || {})[m.date]; if (!d) return false;
    const sc = matchScores(m);
    return (d.xi || []).some(id => !sc[id] || !sc[id].played);
  });

  return '<h3 style="font-size:12px;color:var(--muted);margin:26px 0 10px">Your team for this gameweek</h3>' +
    '<div class="row" style="margin-bottom:12px">' +
      '<button class="btn gho" data-act="pickxi">Change starting nine</button>' +
      '<button class="btn gho" data-act="captain">Captain</button>' +
      '<button class="btn gho" data-act="chips">Chips</button>' +
      (locked ? "" : '<button class="btn gho" data-act="opensquad">Edit squad</button>') +
      (openSubs.length ? '<button class="btn pri" data-act="subs">Bench cover (' + openSubs.length + ')</button>' : "") +
      '<span class="pill">Team changes: ' + changes + '</span>' +
    '</div>' +
    ((e.pendingChips || {}).gambler ? '<div class="banner">◆ The Gambler is backing ' + esc(pName(e.pendingChips.gambler)) + ' on the next matchday.</div>' : "") +
    '<div class="pitch">' +
      [xi.slice(0, 3), xi.slice(3, 6), xi.slice(6, 9)].map(r => '<div class="prow">' + r.map(id => pcard(id, e, scores, dayR)).join("") + '</div>').join("") +
      (xi.length < XI_SIZE ? '<div class="prow">' + Array.from({ length: XI_SIZE - xi.length }, () => '<div class="pc empty"><div class="nm">Empty</div><div class="pt">–</div></div>').join("") + '</div>' : "") +
      '<div class="bench"><div class="lab">Bench · used only when a starter does not play</div><div class="prow">' +
      (bench.length ? bench.map(id => pcard(id, e, scores, dayR, true)).join("") : '<span class="mini">No bench players yet</span>') +
      '</div></div></div>';
}
function pcard(id, e, scores, dayR, isBench) {
  const sc = scores[id];
  const line = dayR ? (dayR.lines || []).find(l => l.id === id) : null;
  const out = sc && !sc.played;
  const badge = e.captain === id ? '<span class="cap">C</span>' : e.vice === id ? '<span class="cap v">V</span>' : "";
  const pts = line ? line.pts : (sc ? sc.total : null);
  return '<div class="pc' + (out ? " out" : "") + ((e.pendingChips || {}).gambler === id ? " gam" : "") + '" data-player="' + id + '">' + badge +
    '<div class="nm">' + esc(pName(id)) + '</div>' +
    '<div class="pt ' + (pts == null ? "zero" : cls(pts)) + '">' + (pts == null ? "–" : pts) + '</div>' +
    '<div class="sub">' + (out ? "did not play" : isBench ? "bench" : "") + '</div></div>';
}
function squadPicker(e, gw) {
  const sq = e.squad || [], locked = squadLocked(gw);
  const list = activePlayers().slice().sort((a, b) => a.name.localeCompare(b.name));

    list.map(p => {

      const owners = managers().filter(m => (getEntry(m.id, gw).squad || []).includes(p.id)).length;

          '<button class="btn sm ' + (inSq ? "dan" : "") + '" data-toggle="' + p.id + '">' + (inSq ? "Remove" : "Add") + '</button>') + '</td></tr>';
    }).join("") + '</tbody></table></div>';
}
function filterList(q) {
  q = (q || "").toLowerCase();
  document.querySelectorAll("#plist tr").forEach(tr => { tr.style.display = tr.dataset.name.includes(q) ? "" : "none"; });

function captainModal() {
  const e = getEntry(S.me, curGw());
  if ((e.xi || []).length !== XI_SIZE) return toast("Set your starting nine first", true);
  const opt = sel => e.xi.map(id => '<option value="' + id + '" ' + (sel === id ? "selected" : "") + '>' + esc(pName(id)) + '</option>').join("");
  modal("Captain and vice-captain",
    '<p class="note" style="margin:0 0 14px">The captain scores double. If they do not play, the armband passes to the vice-captain. Changing either is free.</p>' +
    '<label class="f"><span>Captain</span><select id="c-cap">' + opt(e.captain) + '</select></label>' +
    '<label class="f"><span>Vice-captain</span><select id="c-vice">' + opt(e.vice) + '</select></label>',
    '<button class="btn gho" data-act="closemodal">Cancel</button><button class="btn pri" data-act="savecap">Save</button>');
}
function chipsModal() {
  const gw = curGw(), e = getEntry(S.me, gw), used = chipsUsedBy(S.me), pend = e.pendingChips || {};
  modal("Chips",
    '<p class="note" style="margin:0 0 14px">One use of each per term. Chips never cost a team change.</p>' +
    '<div class="grid" style="gap:10px">' + Object.keys(CHIPS).map(k => {
      const c = CHIPS[k], isUsed = !!used[k];
      const live = k === "wildcard" ? e.wildcard : !!pend[k];
      return '<div class="chip' + (isUsed && !live ? " used" : "") + (live ? " live" : "") + '">' +
        '<div class="spread"><h4>' + esc(c.name) + '</h4>' +
        (live ? '<span class="pill on">armed</span>' : isUsed ? '<span class="pill off">used</span>' : '<span class="pill">available</span>') + '</div>' +
        '<p>' + esc(c.blurb) + '</p>' +
        (isUsed ? "" : '<button class="btn sm pri" data-chip="' + k + '">Play ' + esc(c.name) + '</button>') + '</div>';
    }).join("") + '</div>');
}
function gamblerModal() {
  const e = getEntry(S.me, curGw());
  modal("The Gambler",
    '<p class="note" style="margin:0 0 14px">Back one of your starters. 10 or more points earns you 10 extra. 5 to 9 is neutral. Under 5 costs you 10. This cannot be undone.</p>' +
    '<label class="f"><span>Your pick</span><select id="g-pick">' +
      e.xi.map(id => '<option value="' + id + '">' + esc(pName(id)) + '</option>').join("") + '</select></label>',
    '<button class="btn gho" data-act="closemodal">Cancel</button><button class="btn pri" data-act="savegambler">Back this player</button>');
}
function subsModal() {
  const gw = curGw(), e = getEntry(S.me, gw);
  const open = publishedIn(gw).filter(m => {
    const d = (e.days || {})[m.date]; if (!d) return false;
    const sc = matchScores(m);
    return (d.xi || []).some(id => !sc[id] || !sc[id].played);
  });
  if (!open.length) return toast("No absent starters to cover");
  modal("Bench cover",
    '<p class="note" style="margin:0 0 14px">Only starters the moderators marked absent can be replaced. Someone who played even briefly cannot. These swaps are free.</p>' +
    open.map(m => {
      const d = e.days[m.date], sc = matchScores(m);
      const bench = (d.bench || []).filter(b => sc[b] && sc[b].played);
      const absent = d.xi.filter(id => !sc[id] || !sc[id].played);
      return '<div style="margin-bottom:16px"><h3>' + matchdayName(m.date) + '</h3>' +
        absent.map(id => '<label class="f"><span>' + esc(pName(id)) + ' did not play — replace with</span>' +
          '<select data-sub="' + m.id + '|' + id + '"><option value="">Leave empty (scores 0)</option>' +
          bench.map(b => '<option value="' + b + '" ' + ((d.subs || {})[id] === b ? "selected" : "") + '>' +
            esc(pName(b)) + ' · ' + sc[b].total + ' pts</option>').join("") + '</select></label>').join("") + '</div>';
    }).join(""),
    '<button class="btn gho" data-act="closemodal">Cancel</button><button class="btn pri" data-act="savesubs">Save cover</button>');
}
function playerModal(pid) {
  let pts = 0, apps = 0;
  const recent = [];
  for (const m of allPublished()) {
    const s = (m.stats || {})[pid]; if (!s || !s.played) continue;
    const sc = (Store.official[m.id] || {})[pid] || { total: 0, lines: [] };
    pts += sc.total; apps++;
    recent.push({ m, sc });
  }
  modal(pName(pid),
    '<div class="bd" style="margin-bottom:14px">' +
      '<div class="l"><span>Season points</span><span>' + pts + '</span></div>' +
      '<div class="l"><span>Matchdays played</span><span>' + apps + '</span></div>' +
      '<div class="l"><span>Average</span><span>' + (apps ? Math.round(pts / apps * 10) / 10 : 0) + '</span></div></div>' +
    (recent.length ? recent.slice(-5).reverse().map(r =>
      '<div style="border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:8px">' +
      '<div class="spread" style="margin-bottom:6px"><b>' + matchdayName(r.m.date) + '</b>' +
      '<span class="' + cls(r.sc.total) + '" style="font-weight:700">' + r.sc.total + '</span></div>' +
      '<div class="bd">' + (r.sc.lines || []).map(l =>
        '<div class="l"><span>' + esc(l.label) + '</span><span class="' + cls(l.pts) + '">' + (l.pts > 0 ? "+" : "") + l.pts + '</span></div>').join("") +
      '</div></div>').join("") : '<p class="note">No appearances yet.</p>'));
}
function matchModal(mid) {
  const m = Store.matches[mid]; if (!m) return;
  const sc = matchScores(m);
  const ids = Object.keys(sc).sort((a, b) => sc[b].total - sc[a].total);
  modal(matchdayName(m.date),
    '<p class="note" style="margin:0 0 12px">' + dayName(m.date) + ' · gameweek ' + m.gw +
      (m.home != null ? ' · final score ' + m.home + '–' + m.away : "") + '</p>' +
    '<div class="tw"><table><thead><tr><th>Player</th><th class="r">G</th><th class="r">A</th><th class="r">Pts</th></tr></thead><tbody>' +
    ids.map(id => {
      const s = (m.stats || {})[id] || {};
      return '<tr><td><button data-player="' + id + '">' + esc(pName(id)) + '</button>' +
        (m.motm === id ? ' <span class="pill warn">MOTM</span>' : "") +
        (!sc[id].played ? ' <span class="mini">did not play</span>' : "") + '</td>' +
        '<td class="r num">' + (s.goals || 0) + '</td><td class="r num">' + (s.assists || 0) + '</td>' +
        '<td class="r num ' + cls(sc[id].total) + '" style="font-weight:700">' + sc[id].total + '</td></tr>';
    }).join("") + '</tbody></table></div>');
}
function myDayModal(mid) {
  const m = Store.matches[mid], r = managerDay(S.me, m);
  if (!r) return toast("You had no team on that matchday");
  modal(matchdayName(m.date) + " — your score",
    '<div class="bd">' + (r.lines || []).map(l =>
      '<div class="l"><span>' + esc(pName(l.id)) + (l.mult > 1 ? ' <span class="pill warn">' + l.mult + '×</span>' : "") +
      (l.bench ? ' <span class="mini">bench boost</span>' : "") + '</span>' +
      '<span class="' + cls(l.pts) + '">' + l.pts + '</span></div>').join("") +
      (r.gambler ? '<div class="l"><span>The Gambler · ' + esc(pName(r.gambler.id)) + ' scored ' + r.gambler.raw + '</span>' +
        '<span class="' + cls(r.gambler.delta) + '">' + (r.gambler.delta > 0 ? "+" : "") + r.gambler.delta + '</span></div>' : "") +
      (r.halved ? '<div class="l"><span>All or Nothing · halved</span><span class="neg">÷2</span></div>' : "") +
      '<div class="t"><span>Matchday total</span><span>' + r.total + '</span></div></div>' +
    ((r.swaps || []).length ? '<p class="note" style="margin-top:10px">' + r.swaps.map(s =>
      esc(pName(s.in)) + " replaced " + esc(pName(s.out)) + (s.auto ? " (automatic)" : "")).join("; ") + '</p>' : "") +
    ((r.notes || []).length ? '<p class="note" style="margin-top:6px">' + r.notes.map(esc).join(" ") + '</p>' : ""));
}
function renameModal() {
  modal("Club name",
    '<label class="f"><span>Your club</span><input type="text" id="t-name" value="' + esc(tName(S.me)) + '"></label>',
    '<button class="btn gho" data-act="closemodal">Cancel</button><button class="btn pri" data-act="saverename">Save</button>');
}

/* ============================================================================
   6. ACTIONS
   ========================================================================== */
const val = id => { const el = $("#" + id); return el ? String(el.value || "").trim() : ""; };
const gwNow = () => curGw();

async function doAuth(up) {
  const email = val("a-email"), pass = val("a-pass");
  if (!email || !pass) return toast("Enter your email and password", true);
  Store.busy = true; render();
  try {
    if (up) {
      const name = val("a-name"), team = val("a-team");
      if (!name) throw new Error("Enter your name.");
      await Store.signUp(email, pass, name, team || name + " FC");
    } else await Store.signIn(email, pass);
  } catch (e) { toast(e.message, true); }
  Store.busy = false; render();
}
async function toggleSquad(pid) {
  const e = getEntry(S.me, gwNow());
  const sq = (e.squad || []).slice();
  const i = sq.indexOf(pid);
  if (i >= 0) sq.splice(i, 1);
  else { if (sq.length >= SQUAD_SIZE) return toast("That is already " + SQUAD_SIZE + " players", true); sq.push(pid); }
  e.squad = sq; render();                       // optimistic, confirmed on save
}
const teamAct = p => Store.act(p, "/api/team");
const adminApi = p => Store.act(p, "/api/admin");

async function adminAct(cmd) {
  const [k, arg] = cmd.split(":");
  if (k === "edit") { S.editMatch = arg; render(); return; }
  if (k === "back") { S.editMatch = null; render(); return; }
  if (k === "schoolday") {
    const days = (C().config.schoolDays || []).slice();
    const i = days.indexOf(+arg); if (i >= 0) days.splice(i, 1); else days.push(+arg);
    return adminApi({ action: "settings", schoolDays: days.sort() });
  }
  if (k === "saveDeadline") return adminApi({ action: "settings", deadline: val("s-dl") });
  if (k === "addPlayer") {
    const name = val("a-pname"); if (!name) return toast("Enter a name", true);
    return adminApi({ action: "addPlayer", name });
  }
  if (k === "togglePlayer") return adminApi({ action: "togglePlayer", playerId: arg });
  if (k === "makeMod") return adminApi({ action: "makeMod", managerId: arg, isAdmin: !C().managers[arg].isAdmin });
  if (k === "resetChips") { if (!confirm("Give " + mName(arg) + " every chip back this term?")) return; return adminApi({ action: "resetChips", managerId: arg }); }
  if (k === "newMatch") { const d = val("nm-date"); if (!d) return toast("Choose a date", true); return adminApi({ action: "newMatch", date: d }); }
  if (k === "endGameweek") { if (!confirm("End gameweek " + curGw() + "? Standings freeze and everyone gets two fresh team changes.")) return; return adminApi({ action: "endGameweek" }); }
  if (k === "newTerm") { if (!confirm("Start a new term? Every manager gets all five chips back.")) return; return adminApi({ action: "newTerm" }); }
  if (k === "lockGameweek") return adminApi({ action: "lockGameweek", locked: !gwOf(curGw()).locked });
  if (k === "recompute") return adminApi({ action: "recompute" });

  const m = Store.matches[S.editMatch];
  if (!m) return;
  if (k === "saveMeta") return adminApi({
    action: "updateMatch", matchId: m.id, kickoff: val("m-kick"), state: val("m-state"),
    homeScore: val("m-home"), awayScore: val("m-away")
  });
  if (k === "saveStats" || k === "publish") {
    const stats = Object.keys(m.stats || {}).map(pid => Object.assign({ player_id: pid }, m.stats[pid]));
    const ok = await adminApi({ action: "saveStats", matchId: m.id, stats, motm: m.motm });
    if (!ok || k === "saveStats") return ok && toast("Draft saved");
    return adminApi({ action: "publish", matchId: m.id });
  }
  if (k === "unpublish") { if (!confirm("Return this matchday to draft? Its scores will be removed until you publish again.")) return; return adminApi({ action: "unpublish", matchId: m.id }); }
  if (k === "deleteMatch") {
    if (!confirm("Delete this matchday and everything recorded on it?")) return;
    const ok = await adminApi({ action: "deleteMatch", matchId: m.id });
    if (ok) { S.editMatch = null; render(); }
    return;
  }
}

/* ---------------- events ---------------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-go],[data-act],[data-player],[data-match],[data-myday],[data-toggle],[data-lb],[data-stats],[data-gw],[data-chip],[data-admin],[data-xi],[data-auth],[data-delpost],[data-close]");
  if (!t) return;
  const d = t.dataset;
  if (d.close && ev.target === t) return closeModal();
  if (d.go) { closeModal(); return go(d.go); }
  if (d.auth) { S.authMode = d.auth; return render(); }
  if (d.player) return playerModal(d.player);
  if (d.match) return matchModal(d.match);
  if (d.myday) return myDayModal(d.myday);
  if (d.lb) { S.lb = d.lb; return render(); }
  if (d.stats) { S.stats = d.stats; return render(); }
  if (d.gw) { S.gwView = +d.gw; return render(); }
  if (d.toggle) return toggleSquad(d.toggle);
  if (d.admin) return adminAct(d.admin);
  if (d.delpost) { if (confirm("Delete this announcement?")) return teamAct({ action: "deletePost", postId: d.delpost }); return; }
  if (d.chip) {
    if (d.chip === "gambler") { closeModal(); return gamblerModal(); }
    const ok = await teamAct({ action: "chip", chip: d.chip });
    if (ok) { closeModal(); toast(CHIPS[d.chip].name + " armed"); }
    return;
  }
  if (d.xi) {
    const i = TMP.indexOf(d.xi);
    if (i >= 0) TMP.splice(i, 1);
    else { if (TMP.length >= XI_SIZE) return toast("That is already " + XI_SIZE, true); TMP.push(d.xi); }
    return drawXi();
  }
  switch (d.act) {
    case "signin": return doAuth(false);
    case "signup": return doAuth(true);
    case "signout": return Store.signOut();
    case "retry": Store.busy = true; render(); await Store.refresh(); Store.busy = false; return render();
    case "closemodal": return closeModal();
    case "opensquad": S.squadOpen = true; return render();
    case "closesquad": S.squadOpen = false; return render();
    case "savesquad": {
      const ok = await teamAct({ action: "squad", squad: getEntry(S.me, gwNow()).squad });
      if (ok) { S.squadOpen = false; toast("Squad saved"); render(); }
      return;
    }
    case "pickxi": return xiModal();
    case "savexi": {
      const ok = await teamAct({ action: "xi", xi: TMP });
      if (ok) { closeModal(); toast("Team saved"); }
      return;
    }
    case "captain": return captainModal();
    case "savecap": {
      const ok = await teamAct({ action: "captain", captain: val("c-cap"), vice: val("c-vice") });
      if (ok) { closeModal(); toast("Armband updated"); }
      return;
    }
    case "chips": return chipsModal();
    case "savegambler": {
      const ok = await teamAct({ action: "chip", chip: "gambler", player: val("g-pick") });
      if (ok) { closeModal(); toast("The Gambler is armed"); }
      return;
    }
    case "subs": return subsModal();
    case "savesubs": {
      const byMatch = {};
      document.querySelectorAll("[data-sub]").forEach(sel => {
        const [mid, out] = sel.dataset.sub.split("|");
        byMatch[mid] = byMatch[mid] || {};
        if (sel.value) byMatch[mid][out] = sel.value;
      });
      let ok = true;
      for (const mid of Object.keys(byMatch)) ok = await teamAct({ action: "subs", matchId: mid, subs: byMatch[mid] }) && ok;
      if (ok) { closeModal(); toast("Bench cover saved"); }
      return;
    }
    case "rename": return renameModal();
    case "saverename": {
      const ok = await teamAct({ action: "teamName", name: val("t-name") });
      if (ok) { closeModal(); toast("Club renamed"); }
      return;
    }
    case "post": {
      const content = val("p-text");
      if (!content) return toast("Write something first", true);
      const ok = await teamAct({ action: "post", kind: val("p-kind"), content });
      if (ok) toast("Announcement published");
      return;
    }
  }
});

/* stat entry: held locally while typing, sent when the moderator saves */
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.st) {
    const m = Store.matches[S.editMatch]; if (!m) return;
    const [pid, key] = el.dataset.st.split("|");
    m.stats[pid] = Object.assign({ played: false, goals: 0, assists: 0, saves: 0, tackles: 0, interceptions: 0, yellow: 0, red: 0, own_goals: 0, clean_sheet: false }, m.stats[pid] || {});
    m.stats[pid][key] = el.type === "checkbox" ? el.checked : Math.max(0, parseInt(el.value || "0", 10) || 0);
    render();
  }
  if (el.dataset && el.dataset.motm) {
    const m = Store.matches[S.editMatch]; if (!m) return;
    m.motm = el.dataset.motm; render();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------------- boot ---------------- */
(async function () {
  render();
  await Store.connect();
  render();
  /* keeps every device in step once a moderator publishes */
  setInterval(() => {
    if (Store.session && Store.core && !Store.busy && !$("#modal").innerHTML && document.visibilityState === "visible")
      Store.refresh(true).then(render);
  }, 25000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Store.session && Store.core) Store.refresh(true).then(render);
  });
})();
</script>
